    "seaborn>=0.13.2,<1",
    "setuptools>=80.9.0",
    "huggingface-hub>=0.33.1"
]


[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^local/*"]

[tool.pyright]
exclude = [
    # Default rules
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    # Custom rules
    "cache",
    "data",
    "exp",
    "local",
]
# venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
extend-exclude = ['data', 'results', 'models_ckpts', 'isolated_prior']

[tool.ruff.lint]
extend-select = ["RUF", "UP", "E501", "E731"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools]
packages = ["nodepfn"]

[tool.uv]
package = true
# Tell uv to only resolve for standard desktop/server operating systems
environments = [
    "sys_platform == 'linux'"
]

[[tool.uv.index]]
name = "torch-index"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-index"
url = "https://data.pyg.org/whl/torch-2.4.0+cu121.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "torch-index" }
pyg-lib = { index = "pyg-index" }
torch_scatter  = { index = "pyg-index" }
torch_sparse = { index = "pyg-index" }

