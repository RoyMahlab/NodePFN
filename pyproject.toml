[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nodepfn"
version = "0.0.2"
description = "NodePFN"
requires-python = "==3.11.15"
dependencies = [
    # ==================================================================
    # Core numerics / ML
    # ==================================================================
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-learn==1.4.0",
    "pandas==2.2.3",
    "Cython==3.2.4",
    "ConfigSpace==0.4.21",
    # ==================================================================
    # PyTorch (cu121) — routed via torch-index below
    # ==================================================================
    "torch==2.2.0",
    "torchvision==0.17.0",
    "triton==2.2.0",
    # ==================================================================
    # PyTorch Geometric stack — routed via pyg-index below
    # ==================================================================
    "torch-geometric==2.7.0",
    "pyg-lib==0.4.0",
    "torch_scatter==2.1.2",
    "torch_sparse==0.6.18",
    "torch_cluster==1.6.3",
    "torch_spline_conv==1.2.2",
    # ==================================================================
    # Gaussian processes
    # ==================================================================
    "gpytorch==1.15.2",
    "linear_operator==0.6.1",
    # ==================================================================
    # Graph datasets
    # ==================================================================
    "ogb==1.3.6",
    "networkx==3.3",
    # ==================================================================
    # HuggingFace
    # ==================================================================
    "transformers==4.57.1",
    "huggingface-hub==0.36.2",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "hf-xet==1.4.3",
    # ==================================================================
    # Experiment tracking / logging
    # ==================================================================
    "wandb==0.25.1",
    "tensorboardX==2.6.2.2",
    "sentry-sdk==2.57.0",
    "GitPython==3.1.46",
    # ==================================================================
    # Plotting
    # ==================================================================
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    # ==================================================================
    # Utilities
    # ==================================================================
    "tqdm==4.67.3",
    "typer==0.24.1",
    "rich==14.3.3",
    "ipython==9.10.1",
    "gdown==5.2.0",
    "requests==2.28.1",
    "beautifulsoup4==4.14.3",
    "pydantic==2.12.5",
    "protobuf==6.33.6",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "joblib==1.5.3",
    "outdated==0.2.2",
    "ipywidgets>=8.1.8",
]

[tool.setuptools]
packages = ["nodepfn"]

[tool.uv]
package = true
# Only resolve for standard desktop/server Linux (CUDA wheels)
environments = [
    "sys_platform == 'linux'"
]

[[tool.uv.index]]
name = "torch-index"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-index"
url = "https://data.pyg.org/whl/torch-2.2.0+cu121.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "torch-index" }
torchvision = { index = "torch-index" }
pyg-lib = { index = "pyg-index" }
torch_scatter = { index = "pyg-index" }
torch_sparse = { index = "pyg-index" }
torch_cluster = { index = "pyg-index" }
torch_spline_conv = { index = "pyg-index" }
